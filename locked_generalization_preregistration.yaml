  specialists: disabled
  pca_subspace: disabled
  post_access_architecture_or_threshold_tuning: forbidden

comparison:
  candidate_pool: identical widened pool for the primary selector comparison
  primary_baseline: synthetic_baseline
  primary_method: real_candidate_widened
  secondary_method: real_candidate_nonwidened
  standalone_reference: normal-only foundation-feature anomaly baseline

endpoints:
  primary:
    name: category_macro_selected_dice_delta
    direction: higher_is_better
    comparison: real_candidate_widened_minus_synthetic_baseline
    success_rule: hierarchical_bootstrap_ci95_lower_bound_above_zero
  secondary:
    - selected_dice
    - selected_iou
    - precision
    - recall
    - pixel_ap
    - aupro
    - search_region_recall
    - oracle_dice
    - selection_regret
    - candidate_iou_mae
    - accepted_mask_coverage
    - selective_risk
    - runtime_seconds
    - peak_gpu_memory_bytes
  engineering_targets_not_used_as_publication_filters:
    category_macro_dice_min: 0.55
    every_category_dice_min: 0.30
    category_macro_search_region_recall_min: 0.90
    accepted_mask_coverage_min: 0.75

statistics:
  bootstrap_unit: category_then_image
  bootstrap_replicates: 10000
  bootstrap_seed: 20260724
  confidence_interval: 0.95
  paired_by: category_defect_type_image
  report:
    - category_macro
    - per_category
    - worst_category
    - worst_quartile
    - wins_ties_losses

exclusions:
  permitted:
    - unreadable_or_corrupt_source_file_verified_before_runtime_inference
    - missing_official_pair_detected_during_governed_preparation
  forbidden:
    - exclusion_based_on_model_error_or_low_metric
    - category_specific_post_hoc_threshold
    - category_specific_prompt_or_candidate_bonus
    - rerun_selected_from_multiple_locked_attempts

failure_policy:
  runtime_failure: preserve failed manifest, fix infrastructure only, and rerun without changing behavior
  missing_category_or_mask: stop before inference and repair acquisition provenance
  poor_category_result: report unchanged; do not tune using the exposed category
  null_primary_interval: narrow the claim to development-category calibration
  specialist_or_category_cue_failure: define a future split; do not recycle this locked cohort

execution_order:
  - acquire and hash the source archive
  - split runtime images from isolated official references
  - verify runtime tree contains no ground_truth directory
  - seal runtime, reference, config, code, selector, and model hashes
  - run each preregistered runtime method once without reference-mask access
  - finalize runtime manifests and output hashes
  - invoke locked-evaluate once
  - publish all category results and failure sheets without post-hoc repair
