schema_version: 1
study_id: iadgen-v3-locked-mvtec-r3
sealed_date_utc: "2026-07-24"
status: sealed_before_locked_data_acquisition

research_question:
  primary: >-
    Does real-candidate-calibrated selection with measured repeated-structure
    widening improve selected pseudo-mask Dice over the frozen
    synthetic-corruption-trained selector on categories excluded from all
    architecture and selector development?
  method_label: development-supervised category-held-out pseudo-mask selection

data:
  benchmark: MVTec AD
  license: CC BY-NC-SA 4.0
  development_categories: [bottle, zipper, wood, metal_nut, tile]
  locked_categories:
    [carpet, cable, capsule, grid, hazelnut, leather, pill, screw, toothbrush, transistor]
  source_archive:
    url: >-
      https://huggingface.co/datasets/micguida1/mvtech_anomaly_detection/resolve/main/mvtec_anomaly_detection.tar.xz?download=true
    repository_revision: eb692b36147a3b3f12c561b879a062104c1f20b8
    expected_size_bytes: 5264982680
    expected_linked_etag: cf4313b13603bec67abb49ca959488f7eedce2a9f7795ec54446c649ac98cd3d
  runtime_root: data/mvtec_locked_runtime
  official_reference_root: data/locked_official_reference_masks
  isolation_contract: >-
    Runtime commands receive train/good and test defect images only. Official
    masks are copied to the isolated reference root by
    prepare-locked-benchmark and may be opened only by locked-evaluate.

