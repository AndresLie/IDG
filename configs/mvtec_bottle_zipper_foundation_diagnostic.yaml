project:
  output_dir: outputs/mvtec_bottle_zipper_foundation_diagnostic
  report_dir: reports/mvtec_bottle_zipper_foundation_diagnostic
dataset:
  root: data/mvtec_bottle_zipper_auto_mask
  download: false
  seed: 1337
  adaptation_per_defect: 2
  targets:
    bottle:
    - broken_large
    - broken_small
    - contamination
    zipper:
    - broken_teeth
    - fabric_border
    - split_teeth
generation:
  samples_per_category: 1
  seed: 1337
  device: auto
  image_size: 512
  placement_mode: surface_constrained
  prompt_by_defect:
    broken_large: a large chipped or missing section on the bottle rim
    broken_small: a small chipped or missing section on the bottle rim
    contamination: a visible contamination spot or foreign material on the bottle
    broken_teeth: one or more zipper teeth are broken or missing
    fabric_border: a damaged or irregular zipper fabric border
    split_teeth: zipper teeth are separated or split where they should interlock
  negative_prompt: text, watermark, logo, unrealistic object deformation, artifacts
models:
  mock:
    enabled: true
  sd15:
    enabled: false
evaluation: {}
auto_masks:
  provider: qwen
  qwen_model: Qwen/Qwen2.5-VL-3B-Instruct
  qwen_cache_dir: model_cache/huggingface/hub
  qwen_local_files_only: true
  qwen_min_free_gib: 30.0
  qwen_device: auto
  qwen_dtype: auto
  overwrite: true
  description_by_target:
    bottle/broken_large: Inspect only the bottle silhouette and rim. Find the large
      broken, chipped, or missing glass section. Ignore reflections, the metal cap,
      printed texture, and the background.
    bottle/broken_small: Inspect the bottle rim carefully. Find the small local chip
      or missing glass fragment. Do not select the complete cap, normal rim highlights,
      reflections, or the background.
    bottle/contamination: Find only the abnormal contamination, stain, or foreign-material
      patch on the bottle surface. Ignore normal transparency, highlights, shadows,
      the cap, and background texture.
    zipper/broken_teeth: Inspect the central zipper tooth chain. Find only the tooth
      or short group of teeth that is broken, missing, or deformed. Ignore the regular
      repeating teeth and surrounding fabric.
    zipper/fabric_border: Inspect both fabric borders beside the zipper teeth. Find
      only the damaged, frayed, cut, or irregular border region. Do not select the
      normal repeating teeth or ordinary woven fabric texture.
    zipper/split_teeth: Inspect the central zipper chain. Find the local region where
      the left and right teeth are split, separated, or fail to interlock. Ignore
      normal tooth repetition and intact fabric.
  mask_refinement: auto
  auto_candidate_modes:
  - normal_anomaly
  - foundation_anomaly_field
  - nearest_normal_residual
  - patchcore_guided
  - musc_mutual_score
  - sam_prompt_regularized
  - soft_patch
  - scuff_cluster
  - multi_scuff_fusion
  - support_constrained_fusion
  - normal_residual_fusion
  - repeated_chain_refiner
  - polar_rim_residual
  - zipper_fabric_border_layout
  - fft_texture_suppression
  - sam2_heatmap
  - residual
  - scratch_band_clean
  - structure_tensor_ridge
  - multi_linear
  - pixel
  - procedural
  allow_neural_early_exit: false
  use_ensemble_consensus: true
  use_vlm_critic: false
  ground_truth_mask_variant: eval_mvtec
  eval_mask_variant: eval_mvtec
  training_mask_variant: training_medium
  scuff_soft_label_training: true
  scuff_training_mask_variant: training_soft
  calibrated_soft_scuff_ensemble: true
  eval_mvtec_enabled: true
  bottle_small_eval_mvtec_max_image_fraction: 0.08
