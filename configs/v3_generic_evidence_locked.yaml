project:
  output_dir: outputs/v3_generic_evidence_locked
  report_dir: reports/v3_generic_evidence_locked

dataset:
  root: data/mvtec_locked_runtime
  download: false
  seed: 1337
  adaptation_per_defect: 2
  targets:
    carpet: [color, cut, hole, metal_contamination, thread]
    cable: [bent_wire, cable_swap, combined, cut_inner_insulation, cut_outer_insulation, missing_cable, missing_wire, poke_insulation]
    capsule: [crack, faulty_imprint, poke, scratch, squeeze]
    grid: [bent, broken, glue, metal_contamination, thread]
    hazelnut: [crack, cut, hole, print]
    leather: [color, cut, fold, glue, poke]
    pill: [color, combined, contamination, crack, faulty_imprint, pill_type, scratch]
    screw: [manipulated_front, scratch_head, scratch_neck, thread_side, thread_top]
    toothbrush: [defective]
    transistor: [bent_lead, cut_lead, damaged_case, misplaced]

generation:
  samples_per_category: 10
  seed: 1337
  device: auto
  image_size: 512
  placement_mode: surface_constrained
  prompt_by_defect: {}
  negative_prompt: "text, watermark, logo, unrealistic artifact"

models:
  mock:
    enabled: true
  sd15:
    enabled: false

evaluation:
  visibility_threshold: 0.02
  segmentation_metrics:
    threshold: 0.5

research_governance:
  enabled: true
  architecture_tag: v3-generic-evidence-rc1
  experiment_track: locked-generalization
  development_categories: [bottle, zipper, wood, metal_nut, tile]
  locked_categories: [carpet, cable, capsule, grid, hazelnut, leather, pill, screw, toothbrush, transistor]
  locked_official_mask_roots: [data/locked_official_reference_masks]
  frozen_architecture_manifest: reports/v3_generic_evidence_development/architecture_freeze/v3-generic-evidence-rc1.json
  enforce_official_mask_isolation: true
  dataset_fingerprint_mode: sha256

auto_masks:
  architecture: generic_evidence
  specialists: disabled
  provider: qwen
  publish_dataset_ground_truth: false
  overwrite: true
  qwen_model: Qwen/Qwen2.5-VL-3B-Instruct
  qwen_cache_dir: model_cache/huggingface/hub
  qwen_local_files_only: true
  qwen_min_free_gib: 30.0
  qwen_device: auto
  qwen_dtype: auto
  qwen_prompt_style: defect_localization_json
  min_box_area_ratio: 0.001
  max_box_area_ratio: 0.60
  allow_localization_fallback: true
  localization_fallback_mode: full_image
  min_component_area: 12
  ground_truth_mask_variant: eval_tight
  eval_mask_variant: eval_tight
  training_mask_variant: training_medium
  write_overlays: true
  write_variant_overlays: false
  sam_provider: sam2
  sam2_checkpoint: model_cache/sam2/sam2.1_hiera_tiny.pt
  sam2_model_cfg: configs/sam2.1/sam2.1_hiera_t.yaml
  sam_device: cuda
  dinov2_model: facebook/dinov2-small
  dinov2_cache_dir: model_cache/huggingface/hub
  dinov2_local_files_only: true
  dinov2_device: auto
  selector_model_path: outputs/v3_generic_evidence_development/auto_masks/selector/generic_selector.joblib
  generic_evidence:
    dinov2_enabled: true
    dinov2_scales: [448, 672]
    dinov2_layers: [-4, -1]
    dinov2_memory_stride: 1
    registered_residual_enabled: true
    registration_scale: 448
    registration_min_inlier_ratio: 0.25
    registration_max_reprojection_error: 8.0
    musc_enabled: true
    musc_patch_size: 17
    musc_stride: 6
    musc_knn_k: 5
    musc_max_memory_patches: 4096
    texture_residual_enabled: true
    sam2_enabled: true
    sam_positive_points: 5
    sam_negative_points: 4
    max_normals: 16
