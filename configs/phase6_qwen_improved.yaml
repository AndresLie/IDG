project:
  output_dir: outputs/phase6_qwen_improved
  report_dir: reports/phase6_qwen_improved

dataset:
  root: data/mvtec_ad
  download: true
  seed: 1337
  adaptation_per_defect: 3
  targets:
    metal_nut:
      - scratch
    tile:
      - crack
    wood:
      - scratch

generation:
  samples_per_category: 5
  seed: 1337
  device: auto
  image_size: 512
  placement_mode: surface_constrained
  prompt_by_defect:
    scratch: "a narrow realistic surface scratch on an industrial material"
    crack: "a narrow realistic surface crack on an industrial material"
  negative_prompt: "text, watermark, logo, square boundary, warped surface, unrealistic defect, artifacts"

models:
  mock:
    enabled: true
  sd15:
    enabled: true
    base_model: runwayml/stable-diffusion-inpainting
    controlnet_model: lllyasviel/control_v11p_sd15_canny
    local_files_only: true
    dtype: float16
    num_inference_steps: 8
    guidance_scale: 7.5
    strength: 0.55
    controlnet_conditioning_scale: 0.65

evaluation:
  visibility_threshold: 0.02
  segmentation_metrics:
    threshold: 0.5

phase2:
  provider: qwen
  qwen_model: Qwen/Qwen2.5-VL-3B-Instruct
  qwen_cache_dir: model_cache/huggingface/hub
  qwen_local_files_only: true
  qwen_min_free_gib: 30.0
  qwen_device: auto
  qwen_dtype: auto
  samples_per_category: 5
  token_count: 16
  feature_dim: 64
  box_area_fraction:
    scratch: 0.08
    crack: 0.10
  qwen_max_area_multiplier: 1.5
  min_surface_coverage: 0.70

phase3:
  provider: qwen
  device: cuda
  qwen_model: Qwen/Qwen2.5-VL-3B-Instruct
  qwen_cache_dir: model_cache/huggingface/hub
  qwen_local_files_only: true
  qwen_min_free_gib: 30.0
  qwen_device: auto
  qwen_dtype: auto
  token_count: 16
  clip_token_count: 77
  cross_attention_dim: 768
  adapter_hidden_dim: 256
  denoising_epochs: 5
  learning_rate: 0.0001
  weight_decay: 0.0
  initial_gate_logit: -2.0
  image_size: 512

phase4:
  provider: qwen
  device: cuda
  max_records: 15
  image_size: 512
  num_inference_steps: 8

phase5:
  provider: qwen
  device: cpu
  image_size: 96
  base_channels: 16
  epochs: 12
  learning_rate: 0.001
  dice_loss_weight: 0.5
  max_pos_weight: 25.0
  threshold: 0.5
  threshold_policy: adaptation_dice
  held_out_per_category: 3
  synthetic_ratios: [0.0, 0.5, 0.8]
