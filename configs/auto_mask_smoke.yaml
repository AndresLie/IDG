project:
  output_dir: outputs/auto_mask_smoke
  report_dir: reports/auto_mask_smoke

dataset:
  root: data/auto_mask_smoke
  download: false
  seed: 1337
  adaptation_per_defect: 2
  targets:
    custom_part:
      - scratch

generation:
  samples_per_category: 1
  seed: 1337
  device: auto
  image_size: 512
  placement_mode: surface_constrained
  prompt_by_defect:
    scratch: "a narrow realistic surface scratch on an industrial material"
    crack: "a narrow realistic surface crack on an industrial material"
  negative_prompt: "text, watermark, logo, square boundary, warped surface, unrealistic defect, artifacts"

models:
  mock:
    enabled: true
  sd15:
    enabled: false

evaluation: {}

auto_masks:
  provider: qwen
  qwen_model: Qwen/Qwen2.5-VL-3B-Instruct
  qwen_cache_dir: model_cache/huggingface/hub
  qwen_local_files_only: true
  qwen_min_free_gib: 30.0
  qwen_device: auto
  qwen_dtype: auto
  overwrite: true
  description_by_target:
    custom_part/scratch:
      "000": "a rectangular scuffed patch with many faint short scratches and rubbed light damage on the wood surface"
      "001": "one long narrow vertical scratch running almost the full height of the wood surface"
      "002": "one long diagonal scratch with light surrounding scuff along the scratch path"
  mask_refinement: auto
  auto_candidate_modes: [normal_anomaly, scuff_cluster, scratch_band_clean, structure_tensor_ridge, soft_patch, sam2_heatmap, pixel, residual, multi_linear, linear, procedural]
  ground_truth_mask_variant: eval_tight
  training_mask_variant: training_medium
  eval_tight_radius: 0
  training_medium_radius: 4
  training_wide_radius: 9
  inpaint_variant_radius: 12
  inpaint_variant_blur: 2.0
  scuff_inpaint_core_radius: 5
  scuff_inpaint_halo_radius: 14
  scuff_inpaint_blur: 3.0
  scuff_inpaint_core_weight: 0.65
  scratch_band_inpaint_core_radius: 3
  scratch_band_inpaint_halo_radius: 8
  scratch_band_inpaint_blur: 1.8
  scratch_band_inpaint_core_weight: 0.78
  write_variant_overlays: true
  sam_provider: auto
  allow_heatmap_fallback: true
  heatmap_mask_percentile: 96.0
  sam_positive_points: 3
  sam_negative_points: 2
  sam2_checkpoint: model_cache/sam2/sam2.1_hiera_tiny.pt
  sam2_model_cfg: configs/sam2.1/sam2.1_hiera_t.yaml
  sam_device: cuda
  delta_deno_model: runwayml/stable-diffusion-v1-5
  delta_deno_cache_dir: model_cache/huggingface/hub
  delta_deno_local_files_only: true
  delta_deno_num_inference_steps: 20
  delta_deno_strength: 0.3
  delta_deno_guidance_scale: 7.5
  delta_deno_min_heatmap_contrast: 0.05
  dinov2_model: facebook/dinov2-small
  dinov2_cache_dir: model_cache/huggingface/hub
  dinov2_local_files_only: true
  dinov2_device: auto
  dinov2_max_normals: 16
  dinov2_memory_stride: 1
  dinov2_fusion_dino_weight: 0.55
  dinov2_fusion_percentile: 95.0
  dinov2_fusion_max_components: 24
  dinov2_fusion_envelope_radius: 5
  dinov2_fusion_envelope_percentile: 80.0
  dinov2_fusion_max_box_fraction: 0.22
  dinov2_percentile: 96.0
  dinov2_max_components: 18
  dinov2_dilate_radius: 1
  dinov2_envelope: true
  dinov2_envelope_mode: adaptive
  dinov2_envelope_radius: 5
  dinov2_envelope_percentile: 82.0
  dinov2_max_box_fraction: 0.18
  dinov2_suppress_parallel_texture: true
  dinov2_allow_fallback: true
  pixel_refine_percentile: 94.0
  normal_anomaly_percentile: 96.0
  normal_anomaly_max_normals: 32
  normal_anomaly_max_components: 18
  normal_anomaly_dilate_radius: 1
  normal_anomaly_envelope: true
  normal_anomaly_envelope_mode: adaptive
  normal_anomaly_envelope_radius: 5
  normal_anomaly_envelope_percentile: 82.0
  normal_anomaly_max_box_fraction: 0.18
  normal_anomaly_suppress_parallel_texture: true
  soft_patch_percentile: 93.0
  soft_patch_close_radius: 2
  soft_patch_max_box_fraction: 0.22
  scuff_cluster_close_radius: 3
  scuff_cluster_max_components: 14
  scuff_cluster_max_box_fraction: 0.14
  scuff_eval_tight_radius: 0
  scuff_eval_tight_max_components: 8
  scuff_eval_tight_max_box_fraction: 0.075
  scratch_band_clean_radius: 7
  scratch_band_clean_max_box_fraction: 0.09
  residual_refine_percentile: 95.0
  multi_linear_max_lines: 6
  min_component_area: 16
  shrink_padding_px: 6
  min_box_area_ratio: 0.0005
  max_box_area_ratio: 0.8
  mask_seed: 17
  write_overlays: true
  qwen_prompt_style: defect_localization_json
  clip_to_surface: false
