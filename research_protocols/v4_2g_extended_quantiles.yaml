protocol: iadgen-v2-v4.2g-extended-quantiles
status: sealed-before-execution
sealed_date_utc: "2026-08-11"

motivation: >-
  Diagnostic on retained VisA fused-evidence maps showed the candidate quantile
  family is truncated below its optimal operating point. Sweeping thresholds on
  the same evidence map (96 images, 8 per category) produced monotonically
  rising Dice through the family's upper bound and beyond it:
  p85 0.060, p90 0.071, p95 0.105, p97.5 0.143 (current maximum),
  p99 0.175, p99.5 0.183, p99.75 0.165.
  A single fixed p99.5 threshold with no selector reached 0.183 against the
  deployed pipeline's 0.153, and a per-image oracle threshold reached 0.264.
  Predicted mask area averaged 6.8x the reference area while median VisA
  reference area was 0.23 percent of the image.

hypothesis:
  primary: >-
    Extending candidate_quantiles above 0.975 raises dataset-macro oracle Dice
    because the current family cannot express a tight enough mask for small
    defects.
  secondary: >-
    The trained selector converts part of that raised ceiling into higher
    dataset-macro selected Dice.

design:
  change: candidate_quantiles [0.85, 0.90, 0.95, 0.975] -> [0.85, 0.90, 0.95, 0.975, 0.99, 0.995, 0.999]
  unchanged: >-
    evidence providers, fused maps, selector architecture, feature set,
    selection strategy, risk calibration, decision calibration, sources, folds
  additivity: >-
    Every existing quantile level is retained, so the candidate family is a
    strict superset and per-source oracle Dice cannot regress. A regression
    would indicate an implementation fault, not a negative result.
  validation: five-source leave-dataset-out, identical folds to V4.2f
  baseline: V4.2f (macro oracle 0.5020, macro selected 0.3664, 32,244 candidates)

predeclared_gates:
  per_source_oracle_regression: "<= 0 (correctness check, strict superset)"
  dataset_macro_oracle_gain: ">= +0.0100"
  visa_oracle_gain: ">= +0.0300"
  dataset_macro_selected_regression: "<= 0.0050"
  dataset_macro_selected_gain_for_promotion: ">= +0.0100"
  candidate_pool_growth: "<= 100% (family extension is expected to enlarge the pool; report cost)"
  expected_iou_mae_per_source: "<= 0.1200"

decision_rule: >-
  Promotion requires the selected-Dice gain gate. An oracle-only gain is
  recorded as a proposal-family result and left default-off, exactly as V4.2e
  and V4.2f were. Do not retune quantiles, thresholds, or selector
  hyperparameters on these five exposed sources after reading the outcome. Do
  not evaluate on locked categories.

reporting:
  required:
    - per-source oracle, baseline, and selected Dice
    - dataset-macro oracle and selected Dice
    - candidate count and pool growth
    - expected-IoU MAE and within-image rank Spearman per source
    - selection regret
    - runtime and peak memory
    - every gate result including failures
