[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iadgen-v2"
version = "0.1.0"
description = "Phase 1 scaffolding for VLM-guided industrial surface defect generation."
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "pyyaml>=6",
]

[project.optional-dependencies]
diffusion = [
  "accelerate>=0.30",
  "diffusers>=0.29",
  "opencv-python>=4.8",
  "torch>=2.5",
  "torchvision>=0.20",
  "transformers>=4.40",
  "qwen-vl-utils>=0.0.8",
  "sam2>=1.1.0",
]
dev = [
  "pytest>=8",
]

[project.scripts]
iadgen-v2 = "iadgen_v2.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["iadgen_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
