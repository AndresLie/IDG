project:
  output_dir: outputs/auto_mask_phase9_wood
  report_dir: reports/auto_mask_phase9_wood

dataset:
  root: data/auto_mask_smoke
  download: false
  seed: 1337
  adaptation_per_defect: 2
  targets:
    custom_part:
      - scratch

generation:
  samples_per_category: 1
  seed: 1337
  device: auto
  image_size: 512
  placement_mode: surface_constrained
  prompt_by_defect:
    scratch: "a narrow realistic surface scratch on an industrial material"
    crack: "a narrow realistic surface crack on an industrial material"
  negative_prompt: "text, watermark, logo, square boundary, warped surface, unrealistic defect, artifacts"

models:
  mock:
    enabled: true
  sd15:
    enabled: false

evaluation: {}

auto_masks:
  provider: qwen
  qwen_model: Qwen/Qwen2.5-VL-3B-Instruct
  qwen_cache_dir: model_cache/huggingface/hub
  qwen_local_files_only: true
  qwen_min_free_gib: 30.0
  qwen_device: auto
  qwen_dtype: auto
  overwrite: true
  description_by_target:
    custom_part/scratch:
      "000": "a rectangular scuffed patch with many faint short scratches and rubbed light damage on the wood surface"
      "001": "one long narrow vertical scratch running almost the full height of the wood surface"
      "002": "one long diagonal scratch with light surrounding scuff along the scratch path"
  mask_refinement: auto
  auto_candidate_modes:
    - normal_anomaly
    - nearest_normal_residual
    - patchcore_guided
    - soft_patch
    - scuff_cluster
    - multi_scuff_fusion
    - support_constrained_fusion
    - normal_residual_fusion
    - fft_texture_suppression
    - sam2_heatmap
    - residual
    - scratch_band_clean
    - structure_tensor_ridge
    - multi_linear
    - pixel
    - procedural
  allow_neural_early_exit: false
  use_ensemble_consensus: true
  use_vlm_critic: false
  ground_truth_mask_variant: eval_tight
  training_mask_variant: training_medium
  scuff_soft_label_training: true
  scuff_training_mask_variant: training_soft
  calibrated_soft_scuff_ensemble: true
  soft_scuff_patchcore_weight: 0.42
  soft_scuff_nearest_residual_weight: 0.26
  soft_scuff_fft_weight: 0.18
  soft_scuff_normal_anomaly_weight: 0.14
  soft_scuff_vote_weight: 0.22
  soft_scuff_base_weight: 0.12
  soft_scuff_possible_percentile: 72.0
  soft_scuff_core_percentile: 92.0
  soft_scuff_min_possible_probability: 0.22
  soft_scuff_min_core_probability: 0.62
  soft_scuff_possible_max_box_fraction: 0.22
  soft_scuff_core_max_box_fraction: 0.10
  soft_scuff_possible_floor: 96
  eval_tight_radius: 0
  training_medium_radius: 4
  training_wide_radius: 9
  inpaint_variant_radius: 12
  inpaint_variant_blur: 2.0
  scuff_inpaint_core_radius: 5
  scuff_inpaint_halo_radius: 14
  scuff_inpaint_blur: 3.0
  scuff_inpaint_core_weight: 0.65
  scratch_band_inpaint_core_radius: 3
  scratch_band_inpaint_halo_radius: 8
  scratch_band_inpaint_blur: 1.8
  scratch_band_inpaint_core_weight: 0.78
  write_variant_overlays: true
  sam_provider: auto
  allow_heatmap_fallback: true
  heatmap_mask_percentile: 96.0
  sam_positive_points: 3
  sam_negative_points: 2
  sam2_checkpoint: model_cache/sam2/sam2.1_hiera_tiny.pt
  sam2_model_cfg: configs/sam2.1/sam2.1_hiera_t.yaml
  sam_device: cuda
  pixel_refine_percentile: 94.0
  normal_anomaly_percentile: 96.0
  normal_anomaly_max_normals: 32
  normal_anomaly_max_components: 18
  normal_anomaly_dilate_radius: 1
  normal_anomaly_envelope: true
  normal_anomaly_envelope_mode: adaptive
  normal_anomaly_envelope_radius: 5
  normal_anomaly_envelope_percentile: 82.0
  normal_anomaly_max_box_fraction: 0.18
  normal_anomaly_suppress_parallel_texture: true
  nearest_normal_residual_percentile: 87.0
  nearest_normal_residual_max_normals: 32
  nearest_normal_residual_search_radius: 18
  nearest_normal_residual_search_step: 6
  nearest_normal_residual_close_radius: 2
  nearest_normal_residual_max_components: 14
  nearest_normal_residual_max_box_fraction: 0.115
  patchcore_guided_patch_size: 17
  patchcore_guided_stride: 6
  patchcore_guided_max_normals: 16
  patchcore_guided_max_memory_patches: 4096
  patchcore_guided_percentile: 88.0
  patchcore_guided_close_radius: 2
  patchcore_guided_dilate_radius: 1
  patchcore_guided_max_components: 14
  patchcore_guided_max_box_fraction: 0.12
  patchcore_guided_min_contrast: 0.025
  soft_patch_percentile: 93.0
  soft_patch_close_radius: 2
  soft_patch_max_box_fraction: 0.22
  scuff_cluster_close_radius: 3
  scuff_cluster_max_components: 14
  scuff_cluster_max_box_fraction: 0.14
  multi_scuff_fusion_support_percentile: 76.0
  multi_scuff_fusion_fine_dilate_radius: 5
  multi_scuff_fusion_close_radius: 2
  multi_scuff_fusion_max_components: 10
  multi_scuff_fusion_max_box_fraction: 0.11
  multi_scuff_fusion_grain_reject_angle_degrees: 14.0
  support_heatmap_backend: normal_texture
  support_heatmap_allow_fallback: true
  dinov2_model: facebook/dinov2-small
  dinov2_cache_dir: model_cache/huggingface/hub
  dinov2_local_files_only: true
  dinov2_device: auto
  dinov2_max_normals: 16
  dinov2_memory_stride: 2
  support_constrained_percentile: 78.0
  support_constrained_dilate_radius: 5
  support_constrained_min_overlap: 0.10
  support_constrained_min_heat: 0.34
  support_constrained_min_keep_fraction: 0.55
  support_constrained_grain_reject_angle_degrees: 14.0
  normal_residual_fusion_support_dilate_radius: 4
  normal_residual_fusion_close_radius: 1
  normal_residual_fusion_max_components: 12
  normal_residual_fusion_max_box_fraction: 0.115
  normal_residual_fusion_grain_reject_angle_degrees: 16.0
  scuff_eval_tight_radius: 0
  scuff_eval_tight_max_components: 8
  scuff_eval_tight_max_box_fraction: 0.075
  fft_texture_percentile: 86.0
  fft_texture_min_contrast: 0.04
  fft_texture_max_box_fraction: 0.18
  fft_texture_blend_with_scuff_seeds: true
  fft_peak_count: 10
  fft_notch_radius: 3
  fft_low_frequency_radius: 5
  scratch_band_clean_radius: 7
  scratch_band_clean_max_box_fraction: 0.09
  residual_refine_percentile: 95.0
  multi_linear_max_lines: 6
  min_component_area: 16
  shrink_padding_px: 6
  min_box_area_ratio: 0.0005
  max_box_area_ratio: 0.8
  mask_seed: 17
  write_overlays: true
  qwen_prompt_style: defect_localization_json
  clip_to_surface: false
